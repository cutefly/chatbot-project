name: time_by_region
description: >-
  Gets the current local time for a given region. The region MUST be an IANA
  timezone name such as "Asia/Seoul", "America/New_York", or "Europe/London".
  When the user names a place (e.g. "Seoul", "서울"), convert it to the matching
  IANA timezone before calling. Returns the region, its timezone, and the current
  datetime formatted as "YYYY-MM-DD HH:mm:ss".
endpoint: http://localhost:{PORT}/api/get-time-by-region
method: GET
transform: time
parameters:
  region:
    type: string
    description: >-
      IANA timezone name for the region, e.g. "Asia/Seoul" for Seoul,
      "America/New_York" for New York.
    required: true
    in: query
response_guidance: >-
  시간 조회 결과를 사용자에게 전할 때는 반드시 한국어로 "현재 {지역}의 시간은 YYYY년 MM월 DD일 HH시 mm분 ss초
  입니다." 형식으로 답하라. {지역}에는 사용자가 말한 표현(예: "서울", "뉴욕")을 그대로 쓰고, datetime 필드의 값을
  연/월/일/시/분/초로 분해해 채워라.
